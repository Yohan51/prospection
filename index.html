<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Carte de prospection</title>
<meta name="description" content="Portes frappées autour des chantiers : absents à repasser, R1 pris, refus.">
<meta name="theme-color" content="#1d2730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospection">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Carte plein écran ; barre du haut et barre d'actions flottantes ; une feuille qui monte du bas. */
:root {
  --ardoise: #1d2730;      /* texte, barres */
  --ardoise-2: #3a4855;
  --fond: #f4f6f7;          /* feuilles */
  --surface: #ffffff;
  --trait: #d5dbe0;
  --doux: #5d6b77;          /* texte secondaire */
  --signal: #f2c230;        /* jaune gilet de chantier : l'action principale */
  --signal-encre: #1d2730;
  --st-absent: #e8892b;
  --st-rappel: #2f7ad6;
  --st-r1: #2e9a5a;
  --st-refus: #8a95a0;
  --st-stop: #b23a3a;
  --ombre: 0 6px 24px rgba(17, 25, 33, .18);
  --f-titre: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texte: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ardoise: #e9eef2; --ardoise-2: #c3ccd4; --fond: #151c22; --surface: #1d262e; --trait: #33404b;
    --doux: #9aa7b2; --signal-encre: #151c22; --ombre: 0 6px 24px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ardoise: #e9eef2; --ardoise-2: #c3ccd4; --fond: #151c22; --surface: #1d262e; --trait: #33404b;
  --doux: #9aa7b2; --signal-encre: #151c22; --ombre: 0 6px 24px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fond); color: var(--ardoise); font: 16px/1.4 var(--f-texte); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--st-rappel); outline-offset: 2px; }
[hidden] { display: none !important; }

#carte { position: fixed; inset: 0; background: #dfe5e9; }

/* Barre du haut */
.haut {
  position: fixed; z-index: 500; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
}
.haut > * { pointer-events: auto; }
.compteur {
  flex: 1; min-width: 0; background: var(--surface); border-radius: 12px; box-shadow: var(--ombre);
  padding: 8px 12px; display: flex; flex-direction: column;
}
.compteur .t { font: 600 13px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.compteur .v { font: 600 17px/1.25 var(--f-texte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.rond {
  width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--ombre);
  display: grid; place-items: center; flex: none;
}
.rond svg { width: 22px; height: 22px; }
.rond.actif { background: var(--ardoise); color: var(--surface); }

/* Bouton de position, à droite */
.cote { position: fixed; z-index: 500; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); display: flex; flex-direction: column; gap: 8px; }

/* Barre d'actions */
.actions {
  position: fixed; z-index: 500; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px;
}
.btn {
  border: 0; border-radius: 14px; min-height: 60px; padding: 8px 10px; background: var(--surface); box-shadow: var(--ombre);
  font: 600 15px/1.1 var(--f-titre); letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.btn svg { width: 22px; height: 22px; }
.btn.principal { background: var(--signal); color: var(--signal-encre); font-size: 19px; }
.badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px; background: var(--st-absent); color: #fff; font: 700 13px/18px var(--f-texte); font-variant-numeric: tabular-nums; }

/* Feuille du bas */
.voile { position: fixed; inset: 0; z-index: 900; background: rgba(10, 16, 22, .28); opacity: 0; pointer-events: none; transition: opacity .2s; }
.voile.ouvert { opacity: 1; pointer-events: auto; }
.feuille {
  position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; max-height: 86%; overflow: auto; overscroll-behavior: contain;
  background: var(--fond); border-radius: 18px 18px 0 0; box-shadow: var(--ombre);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .22s ease-out;
}
.feuille.ouverte { transform: none; }
@media (min-width: 720px) { .feuille { left: 50%; width: 560px; margin-left: -280px; } }
@media (prefers-reduced-motion: reduce) { .feuille, .voile { transition: none; } }
.poignee { width: 40px; height: 5px; border-radius: 3px; background: var(--trait); margin: 2px auto 10px; }
.entete { display: flex; align-items: flex-start; gap: 10px; }
.entete h2 { flex: 1; min-width: 0; margin: 0; font: 700 24px/1.1 var(--f-titre); text-wrap: balance; }
.fermer { border: 0; background: var(--surface); width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; }
.sous { color: var(--doux); font-size: 14px; margin: 4px 0 0; }
.pile { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
label.champ, div.champ { display: flex; flex-direction: column; gap: 4px; font: 600 13px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.champ input, .champ textarea, .champ select {
  font: 500 17px/1.3 var(--f-texte); letter-spacing: 0; text-transform: none; color: var(--ardoise);
  background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 11px 12px; width: 100%;
}
.champ textarea { min-height: 70px; resize: vertical; }

.statuts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st {
  border: 2px solid transparent; border-radius: 12px; min-height: 56px; padding: 8px 12px; background: var(--surface);
  display: flex; align-items: center; gap: 10px; text-align: left; font: 600 17px/1.15 var(--f-titre);
}
.st small { display: block; font: 500 13px/1.2 var(--f-texte); color: var(--doux); }
.st .pastille { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.st.courant { border-color: var(--ardoise); }
.st.large { grid-column: 1 / -1; }
.pastille.absent, .p-absent { background: var(--st-absent); }
.pastille.rappel, .p-rappel { background: var(--st-rappel); }
.pastille.r1, .p-r1 { background: var(--st-r1); }
.pastille.refus, .p-refus { background: var(--st-refus); }
.pastille.stop, .p-stop { background: var(--st-stop); }

.ligne-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.b2 { border: 1px solid var(--trait); background: var(--surface); border-radius: 10px; padding: 10px 14px; font: 600 16px/1.1 var(--f-titre); letter-spacing: .02em; text-decoration: none; color: var(--ardoise); display: inline-flex; align-items: center; gap: 6px; }
.b2.plein { background: var(--ardoise); color: var(--surface); border-color: var(--ardoise); }
.b2.jaune { background: var(--signal); color: var(--signal-encre); border-color: var(--signal); }
.b2.danger { color: var(--st-stop); }
.b2.danger.plein { background: var(--st-stop); color: #fff; border-color: var(--st-stop); }
.b2[disabled] { opacity: .5; }

.histo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.histo li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.histo .pastille { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
.histo .quand { color: var(--doux); font-variant-numeric: tabular-nums; white-space: nowrap; }
.histo .note { color: var(--ardoise-2); }
h3 { margin: 6px 0 0; font: 600 14px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }

.liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.liste button { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
.liste .txt { flex: 1; min-width: 0; }
.liste .a { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liste .m { font-size: 14px; color: var(--doux); display: block; }
.liste .conseil { font-size: 13px; color: var(--st-absent); display: block; font-weight: 600; }
.liste .dist { font: 600 15px/1 var(--f-titre); color: var(--doux); white-space: nowrap; font-variant-numeric: tabular-nums; }
.vide { background: var(--surface); border-radius: 12px; padding: 16px; color: var(--doux); font-size: 15px; }

.chiffres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chiffres div { background: var(--surface); border-radius: 10px; padding: 8px 6px; text-align: center; }
.chiffres b { display: block; font: 700 24px/1 var(--f-titre); font-variant-numeric: tabular-nums; }
.chiffres span { font-size: 12px; color: var(--doux); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { border: 1px solid var(--trait); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: 600 15px/1 var(--f-titre); }
.puce[aria-pressed="true"] { background: var(--ardoise); color: var(--surface); border-color: var(--ardoise); }

/* Suivi après R1, rappels */
.carte-suivi, .carte-rappel, .carte-rue { background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.carte-rappel { background: color-mix(in srgb, var(--st-rappel) 10%, var(--surface)); border-color: color-mix(in srgb, var(--st-rappel) 40%, transparent); }
.carte-rappel .quand-r1 { font: 700 19px/1.15 var(--f-titre); }
.carte-rappel .retard { color: var(--st-stop); }
.frise { display: flex; align-items: center; gap: 0; }
.frise i { flex: 1; height: 2px; background: var(--trait); min-width: 8px; }
.frise .etape { font: 600 14px/1 var(--f-titre); padding: 6px 9px; border-radius: 999px; border: 1px solid var(--trait); color: var(--doux); white-space: nowrap; }
.frise .etape.faite { background: color-mix(in srgb, var(--st-r1) 16%, var(--surface)); border-color: color-mix(in srgb, var(--st-r1) 50%, transparent); color: var(--ardoise); }
.frise .etape.courante { background: var(--st-r1); border-color: var(--st-r1); color: #fff; }
.frise.perdu .etape.courante { background: var(--st-stop); border-color: var(--st-stop); }
.suivi-titre { font: 700 19px/1.15 var(--f-titre); }
.suivi-titre small { font: 500 14px/1.3 var(--f-texte); color: var(--doux); display: block; }
.alerte { color: var(--st-absent); font-weight: 600; font-size: 14px; }
.b2.vert { background: var(--st-r1); color: #fff; border-color: var(--st-r1); }
.lien { border: 0; background: none; padding: 0; color: var(--doux); font-size: 14px; text-decoration: underline; align-self: flex-start; }
.m-porte.signe { background: #17663a; border-color: var(--signal); }
.menu-btn { position: relative; }
.menu-btn .badge { position: absolute; top: -5px; right: -5px; background: var(--st-stop); }

/* Besoins du client : menu déroulant à cases */
.deroulant { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 11px 12px;
  font: 500 17px/1.3 var(--f-texte); letter-spacing: 0; text-transform: none; color: var(--ardoise); }
.deroulant span { flex: 1; min-width: 0; }
.deroulant span.vide-choix { color: var(--doux); }
.deroulant svg { width: 18px; height: 18px; flex: none; transition: transform .15s; }
.deroulant[aria-expanded="true"] { border-color: var(--ardoise); }
.deroulant[aria-expanded="true"] svg { transform: rotate(180deg); }
.choix-besoins { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 4px 0; display: flex; flex-direction: column; text-transform: none; letter-spacing: 0; }
.coche { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font: 500 16px/1.25 var(--f-texte); color: var(--ardoise); cursor: pointer; }
.coche + .coche { border-top: 1px solid var(--trait); }
.coche input { width: 22px; height: 22px; margin: 0; accent-color: var(--st-r1); flex: none; }
.etiquettes { display: flex; flex-wrap: wrap; gap: 4px; }
.etiquettes span { font: 600 13px/1 var(--f-texte); padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, var(--st-rappel) 14%, var(--surface)); color: var(--ardoise); }

/* Secteurs */
.secteur { stroke-opacity: .5; fill-opacity: .4; }
.s-signe { stroke: #17663a; fill: #17663a; stroke-opacity: .65; }
.s-r1 { stroke: var(--st-r1); fill: var(--st-r1); }
.s-rappel { stroke: var(--st-rappel); fill: var(--st-rappel); }
.s-rien { stroke: var(--st-refus); fill: var(--st-refus); }
.s-refaire { stroke: var(--signal); fill: var(--signal); stroke-opacity: .9; fill-opacity: .8; }
.secteur.terminee { stroke-dasharray: 1 24; stroke-opacity: .85; }
.legende-secteurs {
  position: fixed; z-index: 450; left: max(12px, env(safe-area-inset-left, 0px)); right: calc(max(12px, env(safe-area-inset-right, 0px)) + 58px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); max-width: 360px; background: var(--surface); border-radius: 12px; box-shadow: var(--ombre); padding: 8px 12px;
  font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
}
.legende-secteurs b { width: 100%; font: 600 13px/1.2 var(--f-titre); letter-spacing: .06em; text-transform: uppercase; color: var(--doux); }
.legende-secteurs i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
body.en-tournee .legende-secteurs { display: none; }
body.secteurs .leaflet-marker-pane { opacity: .45; }
body.secteurs .leaflet-marker-icon { pointer-events: none; }

/* Photos */
.photos { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.vignette { flex: none; width: 76px; height: 76px; border-radius: 10px; border: 0; padding: 0; overflow: hidden; background: var(--surface); }
.vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vignette.ajout { border: 1px dashed var(--doux); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 13px/1 var(--f-titre); color: var(--ardoise-2); }
.vignette.ajout svg { width: 24px; height: 24px; }
.visionneuse { position: fixed; inset: 0; z-index: 1200; background: #000; display: flex; flex-direction: column; }
.visionneuse img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.v-barre { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); color: #fff; }
.v-barre span { flex: 1 1 100%; font-size: 14px; color: #cfd6dc; }
.v-barre button { border: 1px solid #44515c; background: #1d2730; color: #fff; border-radius: 10px; padding: 10px 14px; font: 600 16px/1 var(--f-titre); }
.v-barre button.danger { color: #ff8a80; }
.v-barre button.danger.plein { background: var(--st-stop); color: #fff; }

/* Bilan détaillé (menu) */
.bilan { display: flex; flex-direction: column; gap: 12px; }
.bilan .chiffres span { line-height: 1.15; display: block; margin-top: 3px; }
.barre { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--trait); gap: 2px; }
.barre i { display: block; min-width: 4px; }
.repartition { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; }
.repartition li { display: flex; align-items: center; gap: 6px; }
.repartition .pastille { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.repartition b { margin-left: auto; font-variant-numeric: tabular-nums; }
.taux { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.taux div { display: flex; justify-content: space-between; gap: 10px; }
.taux span { color: var(--doux); }
.taux b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tableau { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; font-size: 14px; font-variant-numeric: tabular-nums; }
.tableau th { font: 600 12px/1 var(--f-titre); letter-spacing: .06em; text-transform: uppercase; color: var(--doux); text-align: right; padding: 9px 8px 6px; }
.tableau td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--trait); }
.tableau th:first-child, .tableau td:first-child { text-align: left; }
.tableau td:first-child { max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tableau td small { display: block; color: var(--doux); font-size: 12px; white-space: normal; }
.tableau td.r1 { color: var(--st-r1); font-weight: 700; }
.tableau tr[data-rue] { cursor: pointer; }
.entonnoir { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
.entonnoir div { display: grid; grid-template-columns: 96px 1fr 34px; gap: 8px; align-items: center; }
.entonnoir em { font-style: normal; height: 10px; border-radius: 5px; background: var(--st-r1); min-width: 3px; display: block; }
.entonnoir em.perdu { background: var(--st-stop); }
.entonnoir b { text-align: right; font-variant-numeric: tabular-nums; }
.journal-jour { font: 600 13px/1 var(--f-titre); letter-spacing: .06em; text-transform: uppercase; color: var(--doux); margin: 6px 0 -2px; }
.journal { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.journal button { width: 100%; border: 0; background: var(--surface); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 44px 10px 1fr; gap: 8px; align-items: baseline; text-align: left; font-size: 14px; }
.journal .h { color: var(--doux); font-variant-numeric: tabular-nums; }
.journal .pastille { width: 10px; height: 10px; border-radius: 50%; transform: translateY(1px); }
.journal .a { font-weight: 600; }
.journal .m { display: block; color: var(--doux); font-size: 13px; }
.journal .note { display: block; color: var(--ardoise-2); font-size: 13px; }

.resultats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.resultats button { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.resultats button[aria-pressed="true"] { outline: 2px solid var(--ardoise); }

.toast {
  position: fixed; z-index: 1100; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translate(-50%, -20px); opacity: 0;
  background: var(--ardoise); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
  max-width: calc(100% - 32px); box-shadow: var(--ombre); transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.vu { opacity: 1; transform: translate(-50%, 0); }
.toast button { pointer-events: auto; margin-left: 10px; border: 0; background: none; color: var(--signal); font-weight: 700; padding: 0; }

/* Marqueurs */
.m-porte { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--f-texte); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.m-porte.autre { border-style: dashed; }
.m-porte.temp { background: var(--signal); color: var(--signal-encre); border-color: var(--ardoise); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .m-porte.temp { animation: none; } }

  <div class="v-barre"><span id="v-info"></span><button id="v-prec" aria-label="Photo précédente">‹</button><button id="v-suiv" aria-label="Photo suivante">›</button>
    <button id="v-partager">Partager</button><button class="danger" id="v-suppr">Supprimer</button><button id="v-fermer">Fermer</button></div></div>

<script src="leaflet.js"></script>
<script>
"use strict";
/* ───────── Réglages ───────── */
const CLE = 'prospection-chantiers-v1';
const CENTRE = [48.9566, 4.3631]; // Châlons-en-Champagne
const GEO = 'https://data.geopf.fr/geocodage';
const STATUTS = {
  absent: { nom: 'Absent', aide: 'à repasser' },
  rappel: { nom: 'Intéressé', aide: 'à rappeler' },
  r1:     { nom: 'R1 pris', aide: 'rendez-vous calé' },
  refus:  { nom: 'Pas intéressé', aide: '' },
  stop:   { nom: 'Ne pas démarcher', aide: 'stop pub, refus net' },
};
const RAYONS = [200, 300, 500, 800];

/* ───────── Données ───────── */
const vide = () => ({ version: 1, moi: '', chantiers: [], portes: [], rues: {} });
let etat = charger();
function charger() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE));
    if (s && s.version === 1 && Array.isArray(s.portes)) return Object.assign(vide(), s);
  } catch (e) {}
  return vide();
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); }
  catch (e) { toast("Enregistrement impossible : stockage plein ou navigation privée."); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const maintenant = () => new Date().toISOString();
const portes = () => etat.portes.filter(p => !p.supprime);
const chantiers = (avecArchives) => etat.chantiers.filter(c => !c.supprime && (avecArchives || !c.archive));
const court = p => (p.rue ? `${p.numero ? p.numero + ' ' : ''}${p.rue}` : String(p.adresse || '').replace(/\s+\d{5}\s.*$/, ''));
const cleAdresse = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

/* ───────── Outils ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function metres(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distTxt = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`;
const jourCle = d => new Date(d).toLocaleDateString('fr-CA'); // AAAA-MM-JJ local
function quand(iso) {
  const d = new Date(iso), auj = new Date();
  const h = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }).replace(':', 'h');
  const j = Math.round((new Date(jourCle(auj)) - new Date(jourCle(d))) / 864e5);
  if (j === 0) return `aujourd'hui ${h}`;
  if (j === 1) return `hier ${h}`;
  if (j < 7) return `${d.toLocaleDateString('fr-FR', { weekday: 'short' })} ${h}`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: d.getFullYear() === auj.getFullYear() ? undefined : 'numeric' });
}
let minuterieToast;
function toast(msg, action) {
  const t = $('#toast');
  t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.classList.remove('vu'); }; t.appendChild(b); }
  t.classList.add('vu');
  clearTimeout(minuterieToast);
  minuterieToast = setTimeout(() => t.classList.remove('vu'), action ? 5000 : 2600);
}
async function geo(url, ms = 7000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function adresseDe(f) {
  const p = f.properties || {}, c = f.geometry && f.geometry.coordinates;
  return {
    label: p.label || [p.housenumber, p.street || p.name, p.city].filter(Boolean).join(' '),
    numero: p.housenumber || '', rue: p.street || p.name || '', ville: p.city || '',
    lat: c ? c[1] : null, lng: c ? c[0] : null,
  };
}
async function adresseInverse(lat, lng) {
  const j = await geo(`${GEO}/reverse?lat=${lat}&lon=${lng}&index=address&limit=1`);
  const f = j.features && j.features[0];
  return f ? adresseDe(f) : null;
}
async function rechercherAdresse(q) {
  const pres = position ? `&lat=${position.lat}&lon=${position.lng}` : `&lat=${CENTRE[0]}&lon=${CENTRE[1]}`;
  const j = await geo(`${GEO}/search?q=${encodeURIComponent(q)}&limit=6&index=address${pres}`);
  return (j.features || []).map(adresseDe);
}

/* ───────── Carte ───────── */
const carte = L.map('carte', { zoomControl: false, attributionControl: true, tap: true }).setView(CENTRE, 15);
const plan = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20, maxNativeZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
});
const aerien = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM_0_19&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
  maxZoom: 20, maxNativeZoom: 19, attribution: '© IGN',
});
let vueAerienne = false;
try { vueAerienne = localStorage.getItem(CLE + ':aerien') === '1'; } catch (e) {}
(vueAerienne ? aerien : plan).addTo(carte);
function majCouche() {
  $('#b-couche').classList.toggle('actif', vueAerienne);
  $('#b-couche').setAttribute('aria-label', vueAerienne ? 'Revenir au plan' : 'Vue aérienne');
}
majCouche();
$('#b-couche').onclick = () => {
  vueAerienne = !vueAerienne;
  carte.removeLayer(vueAerienne ? plan : aerien); (vueAerienne ? aerien : plan).addTo(carte);
  try { localStorage.setItem(CLE + ':aerien', vueAerienne ? '1' : '0'); } catch (e) {}
  majCouche();
  toast(vueAerienne ? 'Vue aérienne : repère les toits moussus' : 'Plan avec numéros de rue');
};

const calqueZones = L.layerGroup().addTo(carte);
const calquePortes = L.layerGroup().addTo(carte);
const calqueChantiers = L.layerGroup().addTo(carte);
const ICONE_TOIT = '<svg viewBox="0 0 24 24" fill="none" stroke="#1d2730" stroke-width="2.4" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/><path d="M6 11v9h12v-9"/></svg>';

function iconePorte(p) {
  const autre = p.auteur && etat.moi && cleAdresse(p.auteur) !== cleAdresse(etat.moi);
  const num = (p.numero || '').slice(0, 4) || '•';
  return L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<div class="m-porte p-${p.statut}${autre ? ' autre' : ''}${etapeDe(p) === 'signe' ? ' signe' : ''}">${esc(num)}</div>` });
}
function dessiner() {
  calquePortes.clearLayers(); calqueChantiers.clearLayers(); calqueZones.clearLayers();
  for (const c of chantiers()) {
    L.circle([c.lat, c.lng], { radius: c.rayon || 300, className: 'zone', interactive: false }).addTo(calqueZones);
    L.marker([c.lat, c.lng], {
      icon: L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [17, 17],
        html: `<div class="m-chantier"><div class="toit">${ICONE_TOIT}</div><div class="nom">${esc(c.nom)}</div></div>` }),
      zIndexOffset: 1000, keyboard: true, title: c.nom,
    }).on('click', () => ouvrirChantier(c.id)).addTo(calqueChantiers);
  }
  for (const p of portes()) {
    L.marker([p.lat, p.lng], { icon: iconePorte(p), keyboard: true, title: court(p) })
      .on('click', () => ouvrirPorte(p.id)).addTo(calquePortes);
  }
  dessinerSecteurs();
  majCompteurs();
}
function majCompteurs() {
  const auj = jourCle(new Date());
  let n = 0, r1 = 0, ouvertes = 0;
  for (const p of portes()) for (const v of p.visites) {
    if (jourCle(v.date) !== auj || (etat.moi && cleAdresse(v.auteur) !== cleAdresse(etat.moi))) continue;
    n++; if (v.statut === 'r1') r1++; if (v.statut !== 'absent') ouvertes++;
  }
  $('#jour').textContent = n === 0 ? 'Aucune porte pour l’instant'
    : `${n} porte${n > 1 ? 's' : ''} · ${ouvertes} ouverte${ouvertes > 1 ? 's' : ''} · ${r1} R1`;
  $('#nb-repasser').textContent = aRepasser().length;
  const dus = rappelsDus().length;
  $('#nb-menu').hidden = !dus; $('#nb-menu').textContent = dus;
  $('#b-menu').setAttribute('aria-label', dus ? `Menu, ${dus} rappel${dus > 1 ? 's' : ''} à faire` : 'Menu');
  $('#aide').hidden = portes().length > 0;
}

/* ───────── Position GPS ───────── */
let position = null, suivi = null, pointMoi = null, cercleMoi = null, attenteFix = [];
function demarrerGPS() {
  if (suivi !== null || !navigator.geolocation) return;
  suivi = navigator.geolocation.watchPosition(pos => {
    position = { lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy, t: Date.now() };
    const ll = [position.lat, position.lng];
    if (!pointMoi) {
      cercleMoi = L.circle(ll, { radius: position.precision, className: 'moi-precision', interactive: false }).addTo(carte);
      pointMoi = L.circleMarker(ll, { radius: 8, className: 'moi-point', interactive: false }).addTo(carte);
    } else { pointMoi.setLatLng(ll); cercleMoi.setLatLng(ll).setRadius(position.precision); }
    attenteFix.splice(0).forEach(f => f(position));
    $('#b-moi').classList.add('actif');
  }, err => {
    attenteFix.splice(0).forEach(f => f(null));
    suivi !== null && navigator.geolocation.clearWatch(suivi); suivi = null;
    $('#b-moi').classList.remove('actif');
    toast(err.code === 1 ? 'Position refusée : autorise la localisation pour Safari dans Réglages.' : 'Position GPS indisponible pour le moment.');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function positionFraiche(ms = 12000) {
  demarrerGPS();
  if (position && Date.now() - position.t < 15000) return Promise.resolve(position);
  return new Promise(res => { attenteFix.push(res); setTimeout(() => res(position), ms); });
}
$('#b-moi').onclick = async () => {
  const p = await positionFraiche();
  if (p) carte.flyTo([p.lat, p.lng], Math.max(carte.getZoom(), 18), { duration: .6 });
};

/* ───────── Feuille ───────── */
let marqueurTemp = null;
function ouvrirFeuille(html, apres) {
  $('#toast').classList.remove('vu');
  $('#f-contenu').innerHTML = html;
  $('#feuille').classList.add('ouverte'); $('#voile').classList.add('ouvert');
  const f = $('#f-contenu .fermer'); if (f) f.onclick = fermerFeuille;
  apres && apres($('#f-contenu'));
}
function fermerFeuille() {
  $('#feuille').classList.remove('ouverte'); $('#voile').classList.remove('ouvert');
  if (marqueurTemp) { carte.removeLayer(marqueurTemp); marqueurTemp = null; }
}
$('#voile').onclick = fermerFeuille;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerFeuille(); });
const BTN_FERMER = '<button class="fermer" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
const liensItineraire = (lat, lng) => `<a class="b2" href="https://maps.apple.com/?daddr=${lat},${lng}" target="_blank" rel="noopener">Plans</a><a class="b2" href="https://waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank" rel="noopener">Waze</a>`;

/* ───────── Portes ───────── */
function chantierProche(lat, lng) {
  let best = null;
  for (const c of chantiers()) { const d = metres([lat, lng], [c.lat, c.lng]); if (!best || d < best.d) best = { c, d }; }
  return best;
}
function porteExistante(adr, lat, lng) {
  const k = cleAdresse(adr && adr.label);
  return portes().find(p => (k && cleAdresse(p.adresse) === k && adr.numero) || metres([p.lat, p.lng], [lat, lng]) < 6);
}
async function nouvellePorteA(lat, lng, origine) {
  photosEnAttente = []; besoinsEnAttente = [];
  if (marqueurTemp) carte.removeLayer(marqueurTemp);
  marqueurTemp = L.marker([lat, lng], { icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], html: '<div class="m-porte temp">?</div>' }), interactive: false }).addTo(carte);
  ouvrirFeuille(`<div class="entete"><h2 id="f-titre">Recherche de l'adresse…</h2>${BTN_FERMER}</div>`);
  let adr = null;
  try { adr = await adresseInverse(lat, lng); } catch (e) { adr = null; }
  if (!$('#feuille').classList.contains('ouverte')) return;

const PERIODES = { jour: 'Aujourd’hui', hier: 'Hier', semaine: '7 jours', mois: 'Ce mois', tout: 'Tout' };

  }).join('')}</ul>`;
  const ref = ruesARefaire();
  if (ref.length) h += `<h3>Rues à refaire</h3><ul class="liste">${ref.map(g => `<li><button data-rue="${esc(g.cle)}">${rond('absent')}<span class="txt"><span class="a">${esc(g.rue)}</span><span class="m">${esc(g.ville)} · faite le ${esc(new Date(etatRue(g.cle).terminee).toLocaleDateString('fr-FR'))}</span></span></button></li>`).join('')}</ul>`;
  return h;
}

async function exporter() {
  const json = JSON.stringify({ app: 'carte-prospection', version: 1, par: etat.moi, exporteLe: maintenant(), chantiers: etat.chantiers, portes: etat.portes.map(p => Object.assign({}, p, { photos: undefined })), rues: etat.rues || {}, besoinsListe: etat.besoinsListe || null, besoinsListeMaj: etat.besoinsListeMaj || '' });
  const nom = `prospection-${cleAdresse(etat.moi || 'moi').replace(/ /g, '-')}-${jourCle(new Date())}.json`;
  const fichier = new File([json], nom, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      await navigator.share({ files: [fichier], title: 'Portes de prospection' });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    etat.dernierExport = maintenant(); sauver();
  } catch (e) { if (e.name !== 'AbortError') toast('Envoi impossible : ' + e.message); }
}
$('#f-import').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const src = JSON.parse(await file.text());
    if (src.app !== 'carte-prospection' || !Array.isArray(src.portes)) throw new Error('ce fichier ne vient pas de la carte de prospection');
    const r = fusionner(src);
    sauver(); dessiner(); fermerFeuille();
    toast(`Import${src.par ? ' de ' + src.par : ''} : ${r.ajouts} ajout${r.ajouts > 1 ? 's' : ''}, ${r.majs} mise${r.majs > 1 ? 's' : ''} à jour`);
  } catch (err) { toast('Import impossible : ' + err.message); }
};
function fusionner(src) {
  let ajouts = 0, majs = 0;
  const cleVisite = v => `${v.date}|${cleAdresse(v.auteur)}|${v.statut}`;
  // Chantiers : le plus récemment modifié gagne
  for (const c of src.chantiers || []) {
    const loc = etat.chantiers.find(x => x.id === c.id);
    if (!loc) { etat.chantiers.push(c); if (!c.supprime) ajouts++; }
    else if (c.maj > loc.maj) { Object.assign(loc, c); majs++; }
  }
  // Portes : même id, ou même adresse précise → on réunit les passages des deux
  for (const p of src.portes || []) {
    let loc = etat.portes.find(x => x.id === p.id);
    if (!loc && p.numero && !p.supprime) loc = etat.portes.find(x => !x.supprime && x.numero && cleAdresse(x.adresse) === cleAdresse(p.adresse));
    if (!loc) { const n = JSON.parse(JSON.stringify(p)); delete n.photos; etat.portes.push(n); if (!p.supprime) ajouts++; continue; }
    const avant = loc.visites.length, etaitSupprime = !!loc.supprime;
    const vus = new Set(loc.visites.map(cleVisite));
    for (const v of p.visites || []) if (!vus.has(cleVisite(v))) loc.visites.push(v);
    loc.visites.sort((a, b) => a.date < b.date ? -1 : 1);
    if (loc.visites.length) loc.statut = loc.visites[loc.visites.length - 1].statut;
    if (p.r1 && (!loc.r1 || (p.r1.cree || '') > (loc.r1.cree || '') || p.maj > loc.maj)) loc.r1 = p.r1;
    if (p.besoins && (p.besoinsMaj || '') > (loc.besoinsMaj || '')) { loc.besoins = p.besoins; loc.besoinsMaj = p.besoinsMaj; }
    if (p.aRappeler && (!loc.aRappeler || (p.aRappeler.maj || '') > (loc.aRappeler.maj || ''))) loc.aRappeler = p.aRappeler;
    const avantSuivi = (loc.suivi || []).length, cleE = e => `${e.date}|${e.etape}|${cleAdresse(e.auteur)}`;
    const vusE = new Set((loc.suivi || []).map(cleE));
    for (const e of p.suivi || []) if (!vusE.has(cleE(e))) (loc.suivi = loc.suivi || []).push(e);
    if (loc.suivi) loc.suivi.sort((a, b) => a.date < b.date ? -1 : 1);
    if (p.maj > loc.maj) { loc.supprime = !!p.supprime; loc.maj = p.maj; }
    if (loc.visites.length !== avant || !!loc.supprime !== etaitSupprime || (loc.suivi || []).length !== avantSuivi) majs++;
  }
  if ((src.besoinsListeMaj || '') > (etat.besoinsListeMaj || '')) { etat.besoinsListe = src.besoinsListe; etat.besoinsListeMaj = src.besoinsListeMaj; }
  // Rues terminées : la décision la plus récente gagne
  etat.rues = etat.rues || {};
  for (const [k, r] of Object.entries(src.rues || {})) if (!etat.rues[k] || r.maj > etat.rues[k].maj) etat.rues[k] = r;
  return { ajouts, majs };
}
