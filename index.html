<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Carte de prospection</title>
<meta name="description" content="Portes frappées autour des chantiers : absents à repasser, R1 pris, refus.">
<meta name="theme-color" content="#1d2730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospection">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Carte plein écran ; barre du haut et barre d'actions flottantes ; une feuille qui monte du bas. */
:root {
  --ardoise: #1d2730;      /* texte, barres */
  --ardoise-2: #3a4855;
  --fond: #f4f6f7;          /* feuilles */
  --surface: #ffffff;
  --trait: #d5dbe0;
  --doux: #5d6b77;          /* texte secondaire */
  --signal: #f2c230;        /* jaune gilet de chantier : l'action principale */
  --signal-encre: #1d2730;
  --st-absent: #e8892b;
  --st-rappel: #2f7ad6;
  --st-r1: #2e9a5a;
  --st-refus: #8a95a0;
  --st-stop: #b23a3a;
  --ombre: 0 6px 24px rgba(17, 25, 33, .18);
  --f-titre: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-texte: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ardoise: #e9eef2; --ardoise-2: #c3ccd4; --fond: #151c22; --surface: #1d262e; --trait: #33404b;
    --doux: #9aa7b2; --signal-encre: #151c22; --ombre: 0 6px 24px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ardoise: #e9eef2; --ardoise-2: #c3ccd4; --fond: #151c22; --surface: #1d262e; --trait: #33404b;
  --doux: #9aa7b2; --signal-encre: #151c22; --ombre: 0 6px 24px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fond); color: var(--ardoise); font: 16px/1.4 var(--f-texte); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--st-rappel); outline-offset: 2px; }
[hidden] { display: none !important; }

#carte { position: fixed; inset: 0; background: #dfe5e9; }

/* Barre du haut */
.haut {
  position: fixed; z-index: 500; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
}
.haut > * { pointer-events: auto; }
.compteur {
  flex: 1; min-width: 0; background: var(--surface); border-radius: 12px; box-shadow: var(--ombre);
  padding: 8px 12px; display: flex; flex-direction: column;
}
.compteur .t { font: 600 13px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.compteur .v { font: 600 17px/1.25 var(--f-texte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.rond {
  width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--ombre);
  display: grid; place-items: center; flex: none;
}
.rond svg { width: 22px; height: 22px; }
.rond.actif { background: var(--ardoise); color: var(--surface); }

/* Bouton de position, à droite */
.cote { position: fixed; z-index: 500; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); display: flex; flex-direction: column; gap: 8px; }

/* Barre d'actions */
.actions {
  position: fixed; z-index: 500; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px;
}
.btn {
  border: 0; border-radius: 14px; min-height: 60px; padding: 8px 10px; background: var(--surface); box-shadow: var(--ombre);
  font: 600 15px/1.1 var(--f-titre); letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.btn svg { width: 22px; height: 22px; }
.btn.principal { background: var(--signal); color: var(--signal-encre); font-size: 19px; }
.badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px; background: var(--st-absent); color: #fff; font: 700 13px/18px var(--f-texte); font-variant-numeric: tabular-nums; }

/* Feuille du bas */
.voile { position: fixed; inset: 0; z-index: 900; background: rgba(10, 16, 22, .28); opacity: 0; pointer-events: none; transition: opacity .2s; }
.voile.ouvert { opacity: 1; pointer-events: auto; }
.feuille {
  position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; max-height: 86%; overflow: auto; overscroll-behavior: contain;
  background: var(--fond); border-radius: 18px 18px 0 0; box-shadow: var(--ombre);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .22s ease-out;
}
.feuille.ouverte { transform: none; }
@media (min-width: 720px) { .feuille { left: 50%; width: 560px; margin-left: -280px; } }
@media (prefers-reduced-motion: reduce) { .feuille, .voile { transition: none; } }
.poignee { width: 40px; height: 5px; border-radius: 3px; background: var(--trait); margin: 2px auto 10px; }
.entete { display: flex; align-items: flex-start; gap: 10px; }
.entete h2 { flex: 1; min-width: 0; margin: 0; font: 700 24px/1.1 var(--f-titre); text-wrap: balance; }
.fermer { border: 0; background: var(--surface); width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; }
.sous { color: var(--doux); font-size: 14px; margin: 4px 0 0; }
.pile { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
label.champ { display: flex; flex-direction: column; gap: 4px; font: 600 13px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
.champ input, .champ textarea, .champ select {
  font: 500 17px/1.3 var(--f-texte); letter-spacing: 0; text-transform: none; color: var(--ardoise);
  background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 11px 12px; width: 100%;
}
.champ textarea { min-height: 70px; resize: vertical; }

.statuts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st {
  border: 2px solid transparent; border-radius: 12px; min-height: 56px; padding: 8px 12px; background: var(--surface);
  display: flex; align-items: center; gap: 10px; text-align: left; font: 600 17px/1.15 var(--f-titre);
}
.st small { display: block; font: 500 13px/1.2 var(--f-texte); color: var(--doux); }
.st .pastille { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.st.courant { border-color: var(--ardoise); }
.st.large { grid-column: 1 / -1; }
.pastille.absent, .p-absent { background: var(--st-absent); }
.pastille.rappel, .p-rappel { background: var(--st-rappel); }
.pastille.r1, .p-r1 { background: var(--st-r1); }
.pastille.refus, .p-refus { background: var(--st-refus); }
.pastille.stop, .p-stop { background: var(--st-stop); }

.ligne-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.b2 { border: 1px solid var(--trait); background: var(--surface); border-radius: 10px; padding: 10px 14px; font: 600 16px/1.1 var(--f-titre); letter-spacing: .02em; text-decoration: none; color: var(--ardoise); display: inline-flex; align-items: center; gap: 6px; }
.b2.plein { background: var(--ardoise); color: var(--surface); border-color: var(--ardoise); }
.b2.jaune { background: var(--signal); color: var(--signal-encre); border-color: var(--signal); }
.b2.danger { color: var(--st-stop); }
.b2.danger.plein { background: var(--st-stop); color: #fff; border-color: var(--st-stop); }
.b2[disabled] { opacity: .5; }

.histo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.histo li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.histo .pastille { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
.histo .quand { color: var(--doux); font-variant-numeric: tabular-nums; white-space: nowrap; }
.histo .note { color: var(--ardoise-2); }
h3 { margin: 6px 0 0; font: 600 14px/1 var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }

.liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.liste button { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; }
.liste .txt { flex: 1; min-width: 0; }
.liste .a { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liste .m { font-size: 14px; color: var(--doux); display: block; }
.liste .conseil { font-size: 13px; color: var(--st-absent); display: block; font-weight: 600; }
.liste .dist { font: 600 15px/1 var(--f-titre); color: var(--doux); white-space: nowrap; font-variant-numeric: tabular-nums; }
.vide { background: var(--surface); border-radius: 12px; padding: 16px; color: var(--doux); font-size: 15px; }

.chiffres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chiffres div { background: var(--surface); border-radius: 10px; padding: 8px 6px; text-align: center; }
.chiffres b { display: block; font: 700 24px/1 var(--f-titre); font-variant-numeric: tabular-nums; }
.chiffres span { font-size: 12px; color: var(--doux); }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { border: 1px solid var(--trait); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: 600 15px/1 var(--f-titre); }
.puce[aria-pressed="true"] { background: var(--ardoise); color: var(--surface); border-color: var(--ardoise); }

.resultats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.resultats button { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.resultats button[aria-pressed="true"] { outline: 2px solid var(--ardoise); }

.toast {
  position: fixed; z-index: 1100; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translate(-50%, -20px); opacity: 0;
  background: var(--ardoise); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
  max-width: calc(100% - 32px); box-shadow: var(--ombre); transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.vu { opacity: 1; transform: translate(-50%, 0); }
.toast button { pointer-events: auto; margin-left: 10px; border: 0; background: none; color: var(--signal); font-weight: 700; padding: 0; }

/* Marqueurs */
.m-porte { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--f-texte); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.m-porte.autre { border-style: dashed; }
.m-porte.temp { background: var(--signal); color: var(--signal-encre); border-color: var(--ardoise); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .m-porte.temp { animation: none; } }
.m-chantier { display: flex; align-items: center; gap: 6px; }
.m-chantier .toit { width: 34px; height: 34px; border-radius: 9px; background: var(--signal); border: 2px solid #1d2730; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.35); flex: none; }
.m-chantier .toit svg { width: 20px; height: 20px; }
.m-chantier .nom { background: #1d2730; color: #fff; font: 600 13px/1 var(--f-titre); letter-spacing: .03em; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.zone { stroke: #1d2730; stroke-dasharray: 6 6; stroke-width: 2; fill: #f2c230; fill-opacity: .08; }
.moi-point { fill: #2f7ad6; stroke: #fff; stroke-width: 3; }
.moi-precision { fill: #2f7ad6; fill-opacity: .12; stroke: #2f7ad6; stroke-opacity: .4; stroke-width: 1; }
.leaflet-container { font-family: var(--f-texte); }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-bottom.leaflet-right { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
.leaflet-control-zoom { display: none; }

.aide-carte {
  position: fixed; z-index: 450; left: max(12px, env(safe-area-inset-left, 0px)); right: calc(max(12px, env(safe-area-inset-right, 0px)) + 58px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); max-width: 420px; background: var(--surface); border-radius: 12px; box-shadow: var(--ombre); padding: 10px 12px; font-size: 14px; color: var(--ardoise-2);
}

/* Carte R1 sur la fiche d'une porte */
.carte-r1 { background: color-mix(in srgb, var(--st-r1) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--st-r1) 45%, transparent); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.carte-r1 .quand-r1 { font: 700 19px/1.15 var(--f-titre); }
.carte-r1 .qui { font-size: 15px; color: var(--ardoise-2); }
.grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Mode tournée de rue */
body.en-tournee .actions, body.en-tournee .aide-carte { display: none; }
.tournee {
  position: fixed; z-index: 600; left: 0; right: 0; bottom: 0; background: var(--fond); border-radius: 18px 18px 0 0; box-shadow: var(--ombre);
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
@media (min-width: 720px) { .tournee { left: 50%; width: 560px; margin-left: -280px; } }
.t-haut { display: flex; align-items: center; gap: 10px; }
.t-haut .t-rue { flex: 1; min-width: 0; }
.t-rue b { display: block; font: 700 18px/1.1 var(--f-titre); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-rue span { font-size: 13px; color: var(--doux); }
.t-num { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.t-num button.pas { height: 52px; border-radius: 12px; border: 1px solid var(--trait); background: var(--surface); font: 700 26px/1 var(--f-titre); }
.t-num .centre { text-align: center; }
.t-num .no { font: 700 40px/1 var(--f-titre); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.t-num .info { font-size: 13px; color: var(--doux); min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-num .info.deja { color: var(--st-absent); font-weight: 600; }
.t-statuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.t-statuts button { border: 0; border-radius: 12px; min-height: 54px; padding: 6px; background: var(--surface); font: 600 15px/1.1 var(--f-titre); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.t-statuts button .pastille { width: 14px; height: 14px; border-radius: 50%; }
.t-statuts button[data-st="r1"] { background: color-mix(in srgb, var(--st-r1) 18%, var(--surface)); }
.t-statuts button.sauter { color: var(--doux); }
.t-statuts button[disabled] { opacity: .45; }
.t-options { display: flex; gap: 6px; flex-wrap: wrap; }
.t-options .puce { font-size: 14px; padding: 6px 10px; }
.t-suite { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.t-suite span { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 600 13px/1 var(--f-texte); padding: 5px 8px; border-radius: 999px; background: var(--surface); color: var(--doux); font-variant-numeric: tabular-nums; }
.t-suite span i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.t-suite span.ici { background: var(--ardoise); color: var(--surface); }
</style>
</head>
<body>
<div id="carte" role="application" aria-label="Carte de prospection"></div>

<div class="haut">
  <button class="compteur" id="b-jour" style="border:0;text-align:left">
    <span class="t">Aujourd'hui</span>
    <span class="v" id="jour">0 porte</span>
  </button>
  <button class="rond" id="b-couche" aria-label="Vue aérienne" title="Plan / vue aérienne">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
  <button class="rond" id="b-menu" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<div class="cote">
  <button class="rond" id="b-moi" aria-label="Me localiser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div class="aide-carte" id="aide" hidden>Touche la carte devant une maison pour noter la porte, ou utilise <b>Porte ici</b> quand tu es devant.</div>

<div class="actions">
  <button class="btn" id="b-repasser">
    <span><span class="badge" id="nb-repasser">0</span></span>À repasser
  </button>
  <button class="btn principal" id="b-ici">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 21V4h11l3 3v14"/><path d="M3 21h18"/><circle cx="14" cy="13" r="1" fill="currentColor"/></svg>
    Porte ici
  </button>
  <button class="btn" id="b-chantier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M6 10v10h12V10"/></svg>
    Chantier
  </button>
</div>

<section class="tournee" id="tournee" hidden aria-label="Tournée de rue"></section>

<div class="voile" id="voile"></div>
<section class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="f-titre"><div class="poignee"></div><div id="f-contenu"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="f-import" accept="application/json,.json" hidden>

<script src="leaflet.js"></script>
<script>
"use strict";
/* ───────── Réglages ───────── */
const CLE = 'prospection-chantiers-v1';
const CENTRE = [48.9566, 4.3631]; // Châlons-en-Champagne
const GEO = 'https://data.geopf.fr/geocodage';
const STATUTS = {
  absent: { nom: 'Absent', aide: 'à repasser' },
  rappel: { nom: 'Intéressé', aide: 'à rappeler' },
  r1:     { nom: 'R1 pris', aide: 'rendez-vous calé' },
  refus:  { nom: 'Pas intéressé', aide: '' },
  stop:   { nom: 'Ne pas démarcher', aide: 'stop pub, refus net' },
};
const RAYONS = [200, 300, 500, 800];

/* ───────── Données ───────── */
const vide = () => ({ version: 1, moi: '', chantiers: [], portes: [] });
let etat = charger();
function charger() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE));
    if (s && s.version === 1 && Array.isArray(s.portes)) return Object.assign(vide(), s);
  } catch (e) {}
  return vide();
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); }
  catch (e) { toast("Enregistrement impossible : stockage plein ou navigation privée."); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const maintenant = () => new Date().toISOString();
const portes = () => etat.portes.filter(p => !p.supprime);
const chantiers = (avecArchives) => etat.chantiers.filter(c => !c.supprime && (avecArchives || !c.archive));
const court = p => (p.rue ? `${p.numero ? p.numero + ' ' : ''}${p.rue}` : String(p.adresse || '').replace(/\s+\d{5}\s.*$/, ''));
const cleAdresse = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

/* ───────── Outils ───────── */
const $ = s => document.querySelector(s);

function metres(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;

  const j = Math.round((new Date(jourCle(auj)) - new Date(jourCle(d))) / 864e5);
  if (j === 0) return `aujourd'hui ${h}`;

/* ───────── Position GPS ───────── */
let position = null, suivi = null, pointMoi = null, cercleMoi = null, attenteFix = [];
function demarrerGPS() {
  if (suivi !== null || !navigator.geolocation) return;
  suivi = navigator.geolocation.watchPosition(pos => {
    position = { lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy, t: Date.now() };
    const ll = [position.lat, position.lng];
    if (!pointMoi) {
      cercleMoi = L.circle(ll, { radius: position.precision, className: 'moi-precision', interactive: false }).addTo(carte);
      pointMoi = L.circleMarker(ll, { radius: 8, className: 'moi-point', interactive: false }).addTo(carte);
    } else { pointMoi.setLatLng(ll); cercleMoi.setLatLng(ll).setRadius(position.precision); }
    attenteFix.splice(0).forEach(f => f(position));
    $('#b-moi').classList.add('actif');
  }, err => {
    attenteFix.splice(0).forEach(f => f(null));
    suivi !== null && navigator.geolocation.clearWatch(suivi); suivi = null;
    $('#b-moi').classList.remove('actif');
    toast(err.code === 1 ? 'Position refusée : autorise la localisation pour Safari dans Réglages.' : 'Position GPS indisponible pour le moment.');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function positionFraiche(ms = 12000) {
  demarrerGPS();
  if (position && Date.now() - position.t < 15000) return Promise.resolve(position);
  return new Promise(res => { attenteFix.push(res); setTimeout(() => res(position), ms); });
}
$('#b-moi').onclick = async () => {

function icsTexte(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }

async function adresseDuNumero(n) {

      const f = (j.features || []).map(adresseDe).find(a => parseInt(a.numero, 10) === n && String(a.numero).replace(/\D/g, '') === String(n) && cleAdresse(a.rue) === cleAdresse(tournee.rue));

    f.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { c.rayon = +b.dataset.r; c.maj = maintenant(); sauver(); dessiner(); ouvrirChantier(c.id); });
    f.querySelector('#b-arch').onclick = () => {
      c.archive = !c.archive; c.maj = maintenant(); sauver(); dessiner(); fermerFeuille();
      toast(c.archive ? 'Chantier masqué de la carte (les portes restent)' : 'Chantier réaffiché');
    };
    const s2 = f.querySelector('#b-csuppr');
    s2.onclick = () => {
      if (s2.dataset.ok) { c.supprime = true; c.maj = maintenant(); sauver(); dessiner(); fermerFeuille(); toast('Chantier supprimé (les portes restent)'); }
      else { s2.dataset.ok = 1; s2.textContent = 'Confirmer'; s2.classList.add('plein'); }
    };
  });
  carte.fitBounds(L.latLng(c.lat, c.lng).toBounds((c.rayon || 300) * 2.3), { paddingBottomRight: [0, 260] });
}

/* ───────── Menu : prénom, partage, sauvegarde ───────── */
$('#b-jour').onclick = () => $('#b-menu').onclick();
$('#b-menu').onclick = () => {
  const ps = portes(), tot = k => ps.filter(p => p.statut === k).length;
  const archives = chantiers(true).filter(c => c.archive);
  const derniere = etat.dernierExport ? quand(etat.dernierExport) : 'jamais';
  ouvrirFeuille(`<div class="entete"><h2 id="f-titre">Prospection</h2>${BTN_FERMER}</div>
    <div class="pile">
      <div class="chiffres">
        <div><b>${ps.length}</b><span>portes</span></div>
        <div><b>${tot('absent')}</b><span>absents</span></div>
        <div><b>${tot('rappel')}</b><span>intéressés</span></div>
        <div><b>${tot('r1')}</b><span>R1 pris</span></div>
      </div>
      ${r1AVenir().length ? `<h3>R1 à venir</h3><ul class="liste">${r1AVenir().map(p => `<li><button data-p="${p.id}"><span class="pastille r1" style="width:14px;height:14px;border-radius:50%;flex:none"></span><span class="txt"><span class="a">${esc(texteR1(p.r1))}</span><span class="m">${esc([p.r1.nom, court(p)].filter(Boolean).join(' · '))}</span></span></button></li>`).join('')}</ul>` : ''}
      <label class="champ">Ton prénom<input id="i-moi" value="${esc(etat.moi)}" placeholder="ex. Yohan" autocomplete="given-name"></label>
      <h3>Partager avec ton collègue</h3>
      <p class="sous" style="margin:0">Envoie-lui ton fichier (AirDrop, Messages…), il l'importe : vos portes sont fusionnées, sans doublon. Il fait pareil dans l'autre sens. Ses portes ont un contour en pointillés.</p>
      <div class="ligne-btns"><button class="b2 plein" id="b-export">Envoyer mes portes</button><button class="b2" id="b-import">Importer un fichier</button></div>
      <p class="sous" style="margin:0">Dernier envoi : ${esc(derniere)}. C'est aussi ta sauvegarde : fais-le au moins une fois par semaine.</p>
      ${chantiers().length ? `<h3>Chantiers en cours</h3><ul class="liste">${chantiers().map(c => { const s = statsZone(c); return `<li><button data-c="${c.id}"><span class="txt"><span class="a">${esc(c.nom)}</span><span class="m">${s.total} porte${s.total > 1 ? 's' : ''} · ${s.r1} R1 · zone ${c.rayon} m</span></span></button></li>`; }).join('')}</ul>` : ''}
      ${archives.length ? `<h3>Chantiers terminés</h3><ul class="liste">${archives.map(c => `<li><button data-c="${c.id}"><span class="txt"><span class="a">${esc(c.nom)}</span><span class="m">${esc(c.adresse)}</span></span></button></li>`).join('')}</ul>` : ''}
      <h3>Calendrier de l'iPhone</h3>
      <p class="sous" style="margin:0">Les R1 passent par l'appli Raccourcis : crée une fois le raccourci « ${NOM_RACCOURCI} » (2 actions, voir le mode d'emploi). Ensuite, « Ajouter au calendrier » inscrit le rendez-vous en une touche.</p>
      <h3>Légende</h3>
      <ul class="histo">${Object.entries(STATUTS).map(([k, s]) => `<li><span class="pastille ${k}"></span><span>${esc(s.nom)}${s.aide ? ` <span class="quand">· ${esc(s.aide)}</span>` : ''}</span></li>`).join('')}</ul>
      <div class="ligne-btns"><button class="b2 danger" id="b-raz">Tout effacer</button></div>
    </div>`, f => {
    f.querySelector('#i-moi').onchange = e => { etat.moi = e.target.value.trim(); sauver(); dessiner(); toast('Prénom enregistré'); };
    f.querySelector('#b-export').onclick = exporter;
    f.querySelector('#b-import').onclick = () => $('#f-import').click();
    f.querySelectorAll('[data-c]').forEach(b => b.onclick = () => ouvrirChantier(b.dataset.c));
    f.querySelectorAll('[data-p]').forEach(b => b.onclick = () => ouvrirPorte(b.dataset.p));
    const r = f.querySelector('#b-raz');
    r.onclick = () => {
      if (r.dataset.ok) { const moi = etat.moi; etat = vide(); etat.moi = moi; sauver(); dessiner(); fermerFeuille(); toast('Tout est effacé'); }
      else { r.dataset.ok = 1; r.textContent = 'Effacer toutes les portes et chantiers ?'; r.classList.add('plein'); }
    };
  });
};
async function exporter() {
  const json = JSON.stringify({ app: 'carte-prospection', version: 1, par: etat.moi, exporteLe: maintenant(), chantiers: etat.chantiers, portes: etat.portes });
  const nom = `prospection-${cleAdresse(etat.moi || 'moi').replace(/ /g, '-')}-${jourCle(new Date())}.json`;
  const fichier = new File([json], nom, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      await navigator.share({ files: [fichier], title: 'Portes de prospection' });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(fichier); a.download = nom;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    etat.dernierExport = maintenant(); sauver();
  } catch (e) { if (e.name !== 'AbortError') toast('Envoi impossible : ' + e.message); }
}
$('#f-import').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const src = JSON.parse(await file.text());
    if (src.app !== 'carte-prospection' || !Array.isArray(src.portes)) throw new Error('ce fichier ne vient pas de la carte de prospection');
    const r = fusionner(src);
    sauver(); dessiner(); fermerFeuille();
    toast(`Import${src.par ? ' de ' + src.par : ''} : ${r.ajouts} ajout${r.ajouts > 1 ? 's' : ''}, ${r.majs} mise${r.majs > 1 ? 's' : ''} à jour`);
  } catch (err) { toast('Import impossible : ' + err.message); }
};
function fusionner(src) {
  let ajouts = 0, majs = 0;
  const cleVisite = v => `${v.date}|${cleAdresse(v.auteur)}|${v.statut}`;
  // Chantiers : le plus récemment modifié gagne
  for (const c of src.chantiers || []) {
    const loc = etat.chantiers.find(x => x.id === c.id);
    if (!loc) { etat.chantiers.push(c); if (!c.supprime) ajouts++; }
    else if (c.maj > loc.maj) { Object.assign(loc, c); majs++; }
  }
  // Portes : même id, ou même adresse précise → on réunit les passages des deux
  for (const p of src.portes || []) {
    let loc = etat.portes.find(x => x.id === p.id);
    if (!loc && p.numero && !p.supprime) loc = etat.portes.find(x => !x.supprime && x.numero && cleAdresse(x.adresse) === cleAdresse(p.adresse));
    if (!loc) { etat.portes.push(JSON.parse(JSON.stringify(p))); if (!p.supprime) ajouts++; continue; }
    const avant = loc.visites.length, etaitSupprime = !!loc.supprime;
    const vus = new Set(loc.visites.map(cleVisite));
    for (const v of p.visites || []) if (!vus.has(cleVisite(v))) loc.visites.push(v);
    loc.visites.sort((a, b) => a.date < b.date ? -1 : 1);
    if (loc.visites.length) loc.statut = loc.visites[loc.visites.length - 1].statut;
    if (p.r1 && (!loc.r1 || (p.r1.cree || '') > (loc.r1.cree || '') || p.maj > loc.maj)) loc.r1 = p.r1;
    if (p.maj > loc.maj) { loc.supprime = !!p.supprime; loc.maj = p.maj; }
    if (loc.visites.length !== avant || !!loc.supprime !== etaitSupprime) majs++;
  }
  return { ajouts, majs };
}

/* ───────── Démarrage ───────── */
dessiner();
try { tournee = JSON.parse(localStorage.getItem(CLE_T)); } catch (e) { tournee = null; }
if (tournee && tournee.rue) { document.body.classList.add('en-tournee'); setTimeout(() => afficherTournee(true), 300); } else tournee = null;
if (portes().length || chantiers().length) {
  const pts = [...portes().map(p => [p.lat, p.lng]), ...chantiers().map(c => [c.lat, c.lng])];
  carte.fitBounds(pts, { maxZoom: 17, padding: [40, 40] });
}
if (!etat.moi) {
  ouvrirFeuille(`<div class="entete"><h2 id="f-titre">Bienvenue</h2>${BTN_FERMER}</div>
    <div class="pile">
      <p style="margin:0">Note chaque porte frappée autour de tes chantiers : la carte garde les absents à repasser, les intéressés et les R1 pris, pour ne jamais refrapper deux fois au même endroit.</p>
      <label class="champ">Ton prénom<input id="i-moi0" placeholder="ex. Yohan" autocomplete="given-name"></label>
      <button class="b2 jaune" id="b-go" style="justify-content:center;min-height:52px">Commencer</button>
      <p class="sous" style="margin:0">Tes données restent sur ce téléphone. Ouvre toujours l'appli depuis son icône sur l'écran d'accueil.</p>
    </div>`, f => {
    f.querySelector('#b-go').onclick = () => {
      etat.moi = f.querySelector('#i-moi0').value.trim(); sauver(); dessiner(); fermerFeuille(); demarrerGPS();
    };
  });
} else {
  demarrerGPS();
}
</script>
</body>
</html>
