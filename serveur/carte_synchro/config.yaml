name: "Carte – synchro"
version: "1.4.0"
slug: carte_synchro
description: "Synchronise la carte de prospection (portes, R1, salons, photos) entre vos appareils"
url: "https://github.com/Yohan51"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
# Réseau de l'hôte : Tailscale (lui aussi sur le réseau de l'hôte) joint la synchro sur localhost:8787
host_network: true
# Pour envoyer le message du matin par une notification Home Assistant
homeassistant_api: true
options:
  code_equipe: ""
  matin_actif: true
  matin_heure: "07:20"
  matin_jours: "lun,mar,mer,jeu,ven"
  matin_prenom: "Yohan"
  matin_notification: ""
  matin_lien_carte: ""
  telegram_jeton: ""
  telegram_chat_id: ""
  agenda_actif: true
  agenda_calendriers: ""
schema:
  code_equipe: password
  matin_actif: bool
  matin_heure: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  matin_jours: str
  matin_prenom: str?
  matin_notification: str?
  matin_lien_carte: str?
  telegram_jeton: password?
  telegram_chat_id: str?
  agenda_actif: bool
  agenda_calendriers: str?
